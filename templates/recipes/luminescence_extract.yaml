# Paper2Data extraction recipe: luminescent complexes
version: "1.0"
id: luminescence_extract
name: "Извлечение: люминесцентные комплексы"
kind: recipe
schema_id: luminescence
description: >
  Шифры → соединения/компоненты → люминесцентные свойства с условиями.
  Узкие targets, без OLED-стека.

defaults:
  strategy: entities_first
  section_include:
    - abstract
    - experimental
    - results
    - esi
  section_exclude:
    - introduction
    - acknowledgments
    - references
  require_quote: true
  quote_verify_threshold: 90

prompt_templates:
  system: |
    Ты — ассистент по извлечению структурированных данных из научной статьи.
    Извлекай только факты, явно присутствующие в тексте. Для каждого поля и
    каждой связи укажи quote (дословную цитату) и block_hint.
    Не выдумывай значения. Если данных нет — пропусти поле.
    Схема проекта:
    {{ schema }}
    {{ instructions }}

  extract_entities: |
    {{ system }}
    Целевые типы сущностей: {{ entity_types }}.
    Словарь обозначений (если есть):
    {{ abbreviation_map }}
    Уже извлечённый граф (не дублируй те же label/code):
    {{ existing_graph }}
    Примеры (few-shot):
    {{ few_shot }}
    Текст ТЕКУЩЕГО фрагмента секции (не всей статьи целиком):
    {{ section_text }}
    Таблицы:
    {{ tables_md }}
    Подписи рисунков:
    {{ figure_captions }}
    Извлеки все целевые сущности из ЭТОГО фрагмента. Пустой список допустим,
    только если в фрагменте действительно нет таких фактов.
    Верни JSON по схеме:
    {{ json_schema }}

  extract_relations: |
    {{ system }}
    Целевые типы связей: {{ relation_types }}.
    Известные сущности:
    {{ existing_graph }}
    Словарь обозначений:
    {{ abbreviation_map }}
    Текст ТЕКУЩЕГО фрагмента:
    {{ section_text }}
    Таблицы:
    {{ tables_md }}
    Свяжи сущности из графа фактами из этого фрагмента. Не выдумывай связи.
    Верни JSON по схеме:
    {{ json_schema }}

  resolve_codes: |
    {{ system }}
    Построй словарь обозначений: шифр/аббревиатура → полное имя или формула
    соединения/лиганда (например "1" → "Eu(DBM)3BPhen", "DBM" → "dibenzoylmethane").
    Текст (experimental + results + esi):
    {{ section_text }}
    Верни JSON: {"abbreviations": [{"code": "...", "expansion": "...", "quote": "...",
    "block_hint": "..."}]}.

steps:
  - id: resolve_abbreviations
    name: "Словарь обозначений"
    description: "Шифры комплексов и аббревиатуры лигандов."
    strategy: one_shot
    section_include:
      - experimental
      - results
      - esi
    targets:
      entities: []
      relations: []
    prompt_template: resolve_codes
    output_key: abbreviation_map
    human_review: true

  - id: extract_compounds
    name: "Соединения и состав"
    description: "Комплексы, семейства, катион/лиганды."
    strategy: entities_first
    section_include:
      - abstract
      - experimental
      - results
      - esi
    instructions: >
      Извлекай шифры комплексов, семейства и состав (катион/лиганды).
      Не извлекай численные спектральные свойства — отдельный шаг.
    targets:
      entities:
        - Paper
        - CompoundFamily
        - Compound
        - Component
      relations:
        - HAS_FAMILY
        - HAS_MEMBER
        - HAS_COMPONENT
        - SAME_AS
        - SYNTHESIZED_LIKE
        - REPORTED_IN
    phases:
      - name: entities
        prompt_template: extract_entities
        human_review: true
      - name: relations
        prompt_template: extract_relations
        human_review: true
    human_review: true

  - id: extract_luminescence
    name: "Люминесцентные свойства"
    description: "QY, λ, lifetime, radiative_lifetime, FWHM, Stokes, CIE, T1/S1 с Condition."
    strategy: entities_first
    section_include:
      - experimental
      - results
      - esi
    instructions: >
      Извлекай люминесцентные свойства (QY, λ_em, lifetime, radiative_lifetime,
      FWHM, Stokes, CIE, T1/S1) только с цитатой и Condition
      (раствор/порошок/плёнка, растворитель, T, λ_ex/λ_em).
      ηsens, η_sens, sensitization efficiency → property_type sensitization_efficiency.
      Это не quantum_yield. quantum_yield — только Φ, PLQY, Φ_Ln.
      Если приведены и Φ, и ηsens — два Property.
      lifetime — наблюдаемое τ (τ_obs); radiative_lifetime — τ_rad, если авторы
      приводят излучательное время жизни отдельно.
    targets:
      entities:
        - Property
        - Condition
      relations:
        - HAS_PROPERTY
        - MEASURED_UNDER
        - MEASURED_ON
    phases:
      - name: entities
        prompt_template: extract_entities
        human_review: true
      - name: relations
        prompt_template: extract_relations
        human_review: true
    human_review: true

pipeline:
  - resolve_abbreviations
  - extract_compounds
  - extract_luminescence
